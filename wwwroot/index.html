<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Results Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: #fff;
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 30px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 65, 65, 0.35), transparent 36%),
      linear-gradient(135deg, #b30000 0%, #4b0000 38%, #130000 68%, #050505 100%);
    background-attachment: fixed;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 6vw, 3.4rem);
    letter-spacing: -0.04em;
    text-shadow: 0 3px 18px rgba(0, 0, 0, 0.5);
  }
  #status { color: #ddd; font-size: 0.9em; margin-bottom: 24px; }
  #status.live { color: #fff; }
  #teamPicker { margin-bottom: 20px; }
  #teamPicker label { font-weight: 600; margin-right: 8px; }
  #teamSelect {
    font: inherit;
    color: #fff;
    padding: 8px 34px 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
  }
  #resultsChart {
    display: grid;
    gap: 18px;
    padding: 28px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.38);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
  }
  .entry { display: grid; grid-template-columns: 100px 1fr; gap: 8px 14px; align-items: center; }
  .entry-name { font-weight: 700; grid-row: span 4; font-size: 1.1rem; }
  .score { display: grid; grid-template-columns: 85px 1fr 24px; gap: 8px; align-items: center; }
  .track { height: 24px; background: rgba(255, 255, 255, 0.14); border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; border-radius: 999px; box-shadow: 0 0 18px rgba(255, 60, 60, 0.5); transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
  .value { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    body { padding: 36px 18px; }
    #resultsChart { padding: 20px; }
    .entry { grid-template-columns: 1fr; }
    .entry-name { grid-row: auto; margin-bottom: 8px; }
    .score { grid-template-columns: 82px 1fr 20px; }
  }
</style>
</head>
<body>
  <h1>Judging Results</h1>
  <div id="status">Connecting...</div>
  <div id="teamPicker" hidden>
    <label for="teamSelect">Team</label>
    <select id="teamSelect"></select>
  </div>
  <div id="resultsChart" aria-label="Judging results graph"></div>

<script>
  const chart = document.getElementById('resultsChart');
  const statusEl = document.getElementById('status');
  const teamPicker = document.getElementById('teamPicker');
  const teamSelect = document.getElementById('teamSelect');
  let entries = [];
  let winPotentials = [];
  let lastPayloadVersion = '';
  const resultsApiUrl = '/api/results';

  function randomScore() {
    return Math.floor(Math.random() * 5) + 1;
  }

  function render(payload) {
    const payloadVersion = JSON.stringify(payload.entries || []);
    if (payloadVersion === lastPayloadVersion) return;
    lastPayloadVersion = payloadVersion;

    const previousSelection = teamSelect.value;
    entries = payload.entries || [];
    winPotentials = entries.map((_, index) => {
      let score = randomScore();
      while (score === winPotentials[index]) score = randomScore();
      return score;
    });
    teamSelect.replaceChildren(...entries.map((entry, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = entry.label || `Entry ${index + 1}`;
      return option;
    }));
    teamSelect.value = previousSelection && entries[previousSelection]
      ? previousSelection
      : '0';
    teamPicker.hidden = entries.length < 2;
    renderSelectedTeam();
    statusEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
    statusEl.classList.add('live');
  }

  function renderSelectedTeam() {
    const index = Number(teamSelect.value || 0);
    const entry = entries[index];
    if (!entry) {
      chart.replaceChildren();
      delete chart.dataset.teamIndex;
      return;
    }

    const scores = [
      ['Theme', entry.theme],
      ['Creativity', entry.creativity],
      ['Execution', entry.execution],
      ['Win Potential', winPotentials[index]]
    ];
    const color = 'linear-gradient(90deg, #e60000, #ff5a5a)';

    // Keep the same DOM nodes mounted when results change. CSS can then
    // interpolate each bar from its current width to the new score.
    if (chart.dataset.teamIndex === String(index)) {
      const group = chart.querySelector('.entry');
      group.querySelector('.entry-name').textContent = entry.label || `Entry ${index + 1}`;
      group.querySelectorAll('.score').forEach((row, scoreIndex) => {
        const value = scores[scoreIndex][1];
        row.querySelector('.bar').style.width = `${value * 20}%`;
        row.querySelector('.value').textContent = value;
      });
      return;
    }

    const group = document.createElement('section');
    group.className = 'entry';
    const name = document.createElement('div');
    name.className = 'entry-name';
    name.textContent = entry.label || `Entry ${index + 1}`;
    group.append(name);

    const bars = [];
    scores.forEach(([label, value]) => {
      const row = document.createElement('div');
      row.className = 'score';
      row.innerHTML = `<span>${label}</span><div class="track"><div class="bar"></div></div><span class="value"></span>`;
      const bar = row.querySelector('.bar');
      bar.style.cssText = `width:0;background:${color}`;
      row.querySelector('.value').textContent = value;
      bars.push({ bar, value });
      group.append(row);
    });

    chart.replaceChildren(group);
    chart.dataset.teamIndex = index;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bars.forEach(({ bar, value }) => { bar.style.width = `${value * 20}%`; });
    }));
  }

  teamSelect.addEventListener('change', renderSelectedTeam);

  async function fetchResults() {
    const response = await fetch(resultsApiUrl, { cache: 'no-store' });
    if (response.status === 404) return null;
    if (!response.ok) throw new Error(`Results API returned ${response.status}`);
    return response.json();
  }

  // The results API is the source of truth for initial and ongoing data.
  fetchResults()
    .then(data => { if (data) render(data); else statusEl.textContent = 'Waiting for results file...'; })
    .catch(err => { statusEl.textContent = `Could not load results: ${err.message}`; });

  // Polling also keeps updates working when the optional SignalR CDN is blocked.
  setInterval(() => {
    fetchResults()
      .then(data => { if (data) render(data); })
      .catch(err => console.error('Results polling error:', err));
  }, 1000);

  // Live updates whenever the controller/watcher reads a new file
  if (window.signalR) {
    const connection = new signalR.HubConnectionBuilder()
      .withUrl('/resultsHub')
      .withAutomaticReconnect()
      .build();

    connection.on('ResultsUpdated', render);
    connection.start().catch(err => console.error('SignalR connection error:', err));
  } else {
    console.warn('SignalR client unavailable; initial results will still be displayed.');
  }
</script>
</body>
</html>
