<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Judge | TheEthicalAiJudge</title>
  <link rel="stylesheet" href="styles.css">
  <script src="judge.js" defer></script>
</head>
<body>
  <main class="page-shell judge-page">
    <header class="judge-header">
      <p class="brand">TheEthical<span>Ai</span>Judge</p>
      <p id="status" class="status">Ready</p>
    </header>

    <section class="judge-stage">
      <video id="camera" autoplay muted playsinline></video>
      <p id="transcript" class="transcript">Your transcript will appear here.</p>
    </section>

    <button id="toggle" class="primary-button" type="button">Start Judge</button>
  </main>
</body>
</html>
